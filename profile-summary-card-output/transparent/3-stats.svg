<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img">
    <title>DaBinBinah GitHub statistics</title>
    <desc>Stars, forks, issues, and activity totals.</desc>
    <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .title { fill: #58a6ff; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #8b949e; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value { fill: #f0f6fc; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .frame { fill: url(#card-bg); stroke: #30363d; stroke-width: 1; }
    .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 3 3; }
    .item { opacity: 0; animation: fade-in .5s ease-out forwards; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .item { opacity: 1 !important; animation: none !important; } }
  </style>
    <rect x="1" y="1" width="358" height="178" rx="10" class="frame"/>
    <text x="22" y="34" class="title">GitHub Statistics</text>
    <g class="item" style="animation-delay:0ms"><circle cx="28" cy="61" r="4.5" fill="#e3b341"/><text x="42" y="66" class="label">Total stars earned</text><text x="328" y="66" text-anchor="end" class="value" font-size="15">3</text></g><g class="item" style="animation-delay:120ms"><circle cx="28" cy="88" r="4.5" fill="#f78166"/><text x="42" y="93" class="label">Forked projects</text><text x="328" y="93" text-anchor="end" class="value" font-size="15">0</text></g><g class="item" style="animation-delay:240ms"><circle cx="28" cy="115" r="4.5" fill="#58a6ff"/><text x="42" y="120" class="label">Pull Requests & Issues</text><text x="328" y="120" text-anchor="end" class="value" font-size="15">2</text></g><g class="item" style="animation-delay:360ms"><circle cx="28" cy="142" r="4.5" fill="#a371f7"/><text x="42" y="147" class="label">Repositories Contributed</text><text x="328" y="147" text-anchor="end" class="value" font-size="15">4</text></g>
  </svg>