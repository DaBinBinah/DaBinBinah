<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img">
    <title>DaBinBinah contribution overview</title>
    <desc>Public GitHub contribution totals and weekly activity trend.</desc>
    <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .title { fill: #58a6ff; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #8b949e; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value { fill: #f0f6fc; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .frame { fill: url(#card-bg); stroke: #30363d; stroke-width: 1; }
    .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 3 3; }
    .item { opacity: 0; animation: fade-in .5s ease-out forwards; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .item { opacity: 1 !important; animation: none !important; } }
  </style>
    <rect x="1" y="1" width="758" height="178" rx="10" class="frame"/>
    <text x="28" y="32" class="title">DaBinBinah · Contribution Skyline &amp; Overview</text>
    <g class="item" style="animation-delay:0ms"><text x="40" y="66" class="value">120</text><text x="40" y="86" class="label">Total Contributions</text></g><g class="item" style="animation-delay:110ms"><text x="215" y="66" class="value">4</text><text x="215" y="86" class="label">Public Repositories</text></g><g class="item" style="animation-delay:220ms"><text x="390" y="66" class="value">3</text><text x="390" y="86" class="label">Stargazers Earned</text></g><g class="item" style="animation-delay:330ms"><text x="565" y="66" class="value">Active 🔥</text><text x="565" y="86" class="label">Commit Streak</text></g>
    <line x1="30" y1="155" x2="730" y2="155" class="grid"/>
    <polyline points="40,140 720,140" fill="none" stroke="#2f81f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" fill="freeze"/>
    </polyline>
  </svg>